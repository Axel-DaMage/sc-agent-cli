name: Security Vulnerability Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Generate audit report
        run: npm audit --json > npm-audit.json
        continue-on-error: true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  malware-scan:
    name: Malware & Backdoor Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for the base diff on pull_request

      - name: Scan for suspicious patterns
        run: |
          echo "🔍 Scanning for malicious patterns..."

          # On PRs, scan only lines ADDED by the change — same convention as
          # pr-security-checks.yml's backdoor-detection job. Whole-repo greps
          # flag pre-existing legitimate identifiers (`untracked`,
          # `token-tracker`, `track()` socket bookkeeping) on every PR.
          # push/schedule still scan the full tree.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCAN_INPUT=$(git diff -U0 origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.js' | grep '^+' | grep -v '^+++' | grep -vE '^\+\s*(//|\*|/\*)' || true)
            SCOPE_DESC="added lines"
          else
            SCAN_INPUT=$(cat $(find src/ -name '*.ts' -o -name '*.js') 2>/dev/null || true)
            SCOPE_DESC="full tree"
          fi
          echo "Scan scope: ${SCOPE_DESC}"
          scan_grep() { echo "${SCAN_INPUT}" | grep -n -E "$1"; }

          # Check for tracking/telemetry code. Concrete telemetry/beacon
          # indicators only — bare `track` matched `token-tracker`,
          # `untracked` and `track()` socket bookkeeping.
          if scan_grep "(analytics|telemetry|phone.?home|sendBeacon|tracking.?pixel|mixpanel|amplitude|posthog|matomo|gtag|google.?analytics|hotjar|fullstory|sentry)"; then
            echo "⚠️  WARNING: Potential tracking code detected"
            exit 1
          fi

          # Check for data exfiltration patterns. Word boundaries keep
          # substring false positives out (requestPermission, 'web_fetch',
          # fetchByUrl); real fetch/axios/request/http.get/http.post calls
          # with a URL literal still match.
          if scan_grep "\\b(fetch|axios|request|http\.get|http\.post)\\b.*http(s)?://" | grep -v "api.openai.com" | grep -v "integrate.api.nvidia.com" | grep -v "api.anthropic.com"; then
            echo "⚠️  WARNING: Suspicious HTTP requests detected"
            exit 1
          fi

          # Check for base64 encoded strings (potential obfuscation)
          if scan_grep "atob|btoa|Buffer\.from.*base64"; then
            echo "⚠️  WARNING: Base64 encoding/decoding detected (potential obfuscation)"
            scan_grep "atob|btoa|Buffer\.from.*base64"
            exit 1
          fi

          # Check for eval() usage
          if scan_grep "eval\("; then
            echo "⚠️  WARNING: eval() usage detected (security risk)"
            scan_grep "eval\("
            exit 1
          fi

          # Check for credential harvesting patterns
          if scan_grep "(password|token|secret|key|credential).*=.*process\.env" | grep -E "(send|post|fetch|upload)"; then
            echo "⚠️  WARNING: Potential credential exfiltration detected"
            exit 1
          fi

          # Check for crypto mining patterns
          if scan_grep "(crypto.?miner|coinhive|monero|bitcoin|mining.?pool)"; then
            echo "⚠️  WARNING: Cryptocurrency mining code detected"
            exit 1
          fi

          echo "✅ No suspicious patterns detected"

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  supply-chain-security:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check for dependency confusion
        run: |
          echo "🔍 Checking for dependency confusion attacks..."

          # Check if package.json has suspicious package names
          if grep -E "^  \"(@.+/)?[A-Z]" package.json; then
            echo "⚠️  WARNING: Suspicious package names with capital letters"
            exit 1
          fi

          # Check for packages with unusual version formats
          if grep -E "\"[^\"]+\": \"(git\+|http:\/\/|https:\/\/github\.com(?!\/npm\/))" package.json; then
            echo "⚠️  WARNING: Packages installed from unusual sources"
            grep -n -E "\"[^\"]+\": \"(git\+|http:\/\/|https:\/\/github\.com(?!\/npm\/))" package.json
            exit 1
          fi

          echo "✅ No supply chain issues detected"

      - name: Check package integrity
        run: |
          npm ci
          npm ls --all

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          npx license-checker --summary

          # Fail on GPL licenses (copyleft)
          if npx license-checker --json | grep -E "GPL"; then
            echo "⚠️  WARNING: GPL licensed dependencies detected"
            npx license-checker --json | grep -B 5 "GPL"
            exit 1
          fi

  static-analysis:
    name: Static Code Analysis (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ESLint security rules
        run: |
          npm ci
          npx eslint --ext .ts,.js src/ --max-warnings=0 || true

      - name: Check for hardcoded secrets
        run: |
          # Check for potential hardcoded API keys
          if grep -r -E "(api.?key|secret.?key|password|token).*=.*['\"][a-zA-Z0-9]{20,}" --include="*.ts" --include="*.js" src/; then
            echo "⚠️  WARNING: Potential hardcoded secrets detected"
            grep -r -n -E "(api.?key|secret.?key|password|token).*=.*['\"][a-zA-Z0-9]{20,}" --include="*.ts" --include="*.js" src/
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"
