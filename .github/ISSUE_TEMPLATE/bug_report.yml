name: Bug report
description: Report a bug or unexpected behavior in SC-Agent CLI
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before filing, please check the [FAQ](https://github.com/os-santiago/sc-agent-cli/blob/main/docs/FAQ.md)
        and search [existing issues](https://github.com/os-santiago/sc-agent-cli/issues) for duplicates.

        **Security vulnerabilities:** do NOT report them here — open a
        [private security advisory](https://github.com/os-santiago/sc-agent-cli/security/advisories/new)
        instead (see [SECURITY.md](https://github.com/os-santiago/sc-agent-cli/blob/main/SECURITY.md)).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug — what you expected vs. what actually happened.
      placeholder: Expected ..., but instead ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SC-Agent CLI version
      description: Output of `sc --version` (or `scc --version`).
      placeholder: e.g. 0.4.2
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which OpenAI-compatible provider were you connected to?
      options:
        - Ollama (local)
        - OpenAI
        - Anthropic
        - NVIDIA
        - Groq
        - Together
        - LM Studio
        - Other / custom baseUrl
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - WSL
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command you ran and the minimal steps that trigger the bug. Remove any API keys.
      placeholder: |
        1. Run `sc chat ...`
        2. Type `...`
        3. Observe `...`
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: sc doctor output
      description: Paste the full output of `sc doctor` — it reports config, active profile, API key presence, provider reachability, and permissions.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Terminal output, stack traces, or verbose output (`sc chat -v ...`). Redact API keys and other secrets.
      render: shell
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        Possibly relevant docs: [environment variables](https://github.com/os-santiago/sc-agent-cli/blob/main/docs/environment-variables.md) · [permission profiles](https://github.com/os-santiago/sc-agent-cli/blob/main/docs/permission-profiles.md) · [non-interactive mode](https://github.com/os-santiago/sc-agent-cli/blob/main/docs/non-interactive-mode.md) · [sandboxing](https://github.com/os-santiago/sc-agent-cli/blob/main/docs/sandboxing.md)
